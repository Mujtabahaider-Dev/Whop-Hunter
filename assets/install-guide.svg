<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16181d"/>
      <stop offset="100%" stop-color="#111317"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Step 1 Card -->
  <g transform="translate(20, 20)">
    <rect width="295" height="320" rx="12" fill="url(#cardGrad)" stroke="#23272f" stroke-width="1.5"/>
    <!-- Step Header -->
    <rect x="20" y="20" width="28" height="28" rx="6" fill="#6d28d9"/>
    <text x="34" y="39" fill="#ffffff" font-family="-apple-system, Inter, sans-serif" font-weight="700" font-size="14" text-anchor="middle">1</text>
    <text x="58" y="39" fill="#ffffff" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="14">Download &amp; Unzip</text>

    <!-- Browser Mockup Window -->
    <g transform="translate(20, 70)">
      <rect width="255" height="150" rx="8" fill="#0b0c0e" stroke="#23272f" stroke-width="1"/>
      <rect width="255" height="28" rx="8" fill="#16181d"/>
      <circle cx="14" cy="14" r="4" fill="#3b4252"/>
      <circle cx="26" cy="14" r="4" fill="#3b4252"/>
      <circle cx="38" cy="14" r="4" fill="#3b4252"/>
      <rect x="52" y="7" width="140" height="14" rx="4" fill="#0b0c0e"/>
      <text x="60" y="18" fill="#8b949e" font-family="monospace" font-size="9">github.com/Whop-Hunter</text>

      <!-- Folder Zip Icon Illustration -->
      <rect x="75" y="45" width="105" height="60" rx="6" fill="#16181d" stroke="#6d28d9" stroke-width="1.5"/>
      <path d="M75 57 L180 57" stroke="#23272f" stroke-width="1"/>
      <rect x="110" y="49" width="35" height="6" rx="2" fill="#8b5cf6"/>
      <text x="127" y="80" fill="#ffffff" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Whop-Hunter.zip</text>
      <text x="127" y="96" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">⬇ Extract to Folder</text>
    </g>
    <text x="20" y="260" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="12">Get the latest release archive</text>
    <text x="20" y="280" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="12">and extract files to your PC.</text>
  </g>

  <!-- Step 2 Card -->
  <g transform="translate(345, 20)">
    <rect width="310" height="320" rx="12" fill="url(#cardGrad)" stroke="#23272f" stroke-width="1.5"/>
    <!-- Step Header -->
    <rect x="20" y="20" width="28" height="28" rx="6" fill="#6d28d9"/>
    <text x="34" y="39" fill="#ffffff" font-family="-apple-system, Inter, sans-serif" font-weight="700" font-size="14" text-anchor="middle">2</text>
    <text x="58" y="39" fill="#ffffff" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="14">Enable Developer Mode</text>

    <!-- Browser Settings UI Mockup -->
    <g transform="translate(20, 70)">
      <rect width="270" height="150" rx="8" fill="#0b0c0e" stroke="#23272f" stroke-width="1"/>
      <rect width="270" height="28" rx="8" fill="#16181d"/>
      <circle cx="14" cy="14" r="4" fill="#3b4252"/>
      <circle cx="26" cy="14" r="4" fill="#3b4252"/>
      <rect x="42" y="7" width="160" height="14" rx="4" fill="#0b0c0e"/>
      <text x="50" y="18" fill="#a78bfa" font-family="monospace" font-size="9.5">chrome://extensions</text>

      <!-- Developer Mode Toggle Row -->
      <rect x="15" y="50" width="240" height="42" rx="6" fill="#16181d" stroke="#23272f" stroke-width="1"/>
      <text x="28" y="75" fill="#f3f4f6" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Developer mode</text>
      
      <!-- Glowing Active Toggle Switch -->
      <rect x="195" y="61" width="46" height="20" rx="10" fill="#6d28d9"/>
      <circle cx="230" cy="71" r="8" fill="#ffffff" filter="url(#glow)"/>

      <!-- Instruction note -->
      <rect x="15" y="104" width="240" height="32" rx="6" fill="rgba(109, 40, 217, 0.15)" stroke="rgba(139, 92, 246, 0.3)"/>
      <text x="135" y="124" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Top right toggle activates unpacked mode</text>
    </g>
    <text x="20" y="260" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="12">Open your browser extensions manager</text>
    <text x="20" y="280" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="12">and switch the toggle to ON.</text>
  </g>

  <!-- Step 3 Card -->
  <g transform="translate(685, 20)">
    <rect width="295" height="320" rx="12" fill="url(#cardGrad)" stroke="#23272f" stroke-width="1.5"/>
    <!-- Step Header -->
    <rect x="20" y="20" width="28" height="28" rx="6" fill="#6d28d9"/>
    <text x="34" y="39" fill="#ffffff" font-family="-apple-system, Inter, sans-serif" font-weight="700" font-size="14" text-anchor="middle">3</text>
    <text x="58" y="39" fill="#ffffff" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="14">Click "Load Unpacked"</text>

    <!-- Load Unpacked Action Mockup -->
    <g transform="translate(20, 70)">
      <rect width="255" height="150" rx="8" fill="#0b0c0e" stroke="#23272f" stroke-width="1"/>
      <!-- Top Action Buttons -->
      <g transform="translate(12, 16)">
        <rect width="105" height="30" rx="6" fill="url(#purpleGrad)" stroke="#a78bfa" stroke-width="1"/>
        <text x="52" y="36" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Load unpacked</text>
        <!-- Click Pointer Cursor -->
        <path d="M85 32 L95 45 L90 47 L95 56 L91 58 L86 49 L80 54 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <rect x="122" y="0" width="85" height="30" rx="6" fill="#16181d" stroke="#23272f"/>
        <text x="164" y="20" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Pack extension</text>
      </g>

      <!-- Installed Extension Item Preview -->
      <rect x="12" y="65" width="230" height="68" rx="8" fill="#16181d" stroke="#23272f"/>
      <rect x="22" y="77" width="24" height="24" rx="5" fill="#6d28d9"/>
      <text x="34" y="93" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="12" text-anchor="middle">W</text>
      <text x="54" y="88" fill="#f3f4f6" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Whop Hunter</text>
      <text x="54" y="103" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">1.0.5 · Enabled</text>
      <circle cx="225" cy="85" r="4" fill="#10b981"/>
    </g>
    <text x="20" y="260" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="12">Select the folder and Whop Hunter</text>
    <text x="20" y="280" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="12">activates instantly in your browser!</text>
  </g>
</svg>